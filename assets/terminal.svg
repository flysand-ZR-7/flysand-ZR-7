<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="100%" height="370">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; font-size: 13.5px; }
    .prompt { fill: #ff003c; font-weight: bold; }
    .cmd { fill: #f0f6fc; font-weight: bold; }
    .key { fill: #ff4d6d; font-weight: bold; }
    .val { fill: #c9d1d9; }
    .ok { fill: #00e676; font-weight: bold; }
    .warn { fill: #ffea00; }
    .dim { fill: #6e7681; }
    .cyan { fill: #00e5ff; }
    .l1 { opacity: 0; animation: appear 0.3s ease forwards 0.2s; }
    .l2 { opacity: 0; animation: appear 0.3s ease forwards 0.7s; }
    .l3 { opacity: 0; animation: appear 0.3s ease forwards 1.2s; }
    .l4 { opacity: 0; animation: appear 0.3s ease forwards 1.7s; }
    .l5 { opacity: 0; animation: appear 0.3s ease forwards 2.2s; }
    .l6 { opacity: 0; animation: appear 0.3s ease forwards 2.7s; }
    .l7 { opacity: 0; animation: appear 0.3s ease forwards 3.2s; }
    .l8 { opacity: 0; animation: appear 0.3s ease forwards 3.7s; }
    .l9 { opacity: 0; animation: appear 0.3s ease forwards 4.2s; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Terminal Window Frame -->
  <rect width="900" height="370" rx="10" fill="#07080d" stroke="#21262d" stroke-width="1.5" />
  <rect width="900" height="36" rx="10" fill="#10121a" />
  <rect y="26" width="900" height="10" fill="#10121a" />
  <line x1="0" y1="36" x2="900" y2="36" stroke="#ff003c" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Window Controls -->
  <circle cx="22" cy="18" r="6" fill="#ff003c" />
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="18" r="6" fill="#00e676" />
  <text x="450" y="23" text-anchor="middle" class="mono dim" font-size="12">root@zr7-blackbox: ~/ops/classified (zsh — 127.0.0.1)</text>

  <!-- Line 1: whoami / dossier -->
  <g class="l1">
    <text x="26" y="68" class="mono">
      <tspan class="prompt">┌──(root💀zr7-blackbox)-[~/shadow-ops]</tspan>
    </text>
    <text x="26" y="88" class="mono">
      <tspan class="prompt">└─# </tspan><tspan class="cmd">cat /etc/operator/dossier.conf --decrypt</tspan>
    </text>
  </g>

  <!-- Line 2-5: Dossier output -->
  <g class="l2">
    <text x="40" y="114" class="mono">
      <tspan class="key">[CALLSIGN]   </tspan><tspan class="val">flysand-ZR-7 // </tspan><tspan class="cyan">DeZsec</tspan>
    </text>
  </g>
  <g class="l3">
    <text x="40" y="136" class="mono">
      <tspan class="key">[DOCTRINE]   </tspan><tspan class="val">Red Team Operations · Adversarial Recon · Silent Exploitation</tspan>
    </text>
  </g>
  <g class="l4">
    <text x="40" y="158" class="mono">
      <tspan class="key">[TARGETS]    </tspan><tspan class="val">GraphQL &amp; REST Internals · WebSockets · Auth/SSO Bypass · IDOR · SSRF</tspan>
    </text>
  </g>
  <g class="l5">
    <text x="40" y="180" class="mono">
      <tspan class="key">[ARSENAL]    </tspan><tspan class="val">Go · Rust · Python · Bash · V8 Headless Stealth · Custom C2/Recon Tooling</tspan>
    </text>
  </g>

  <!-- Line 6: Second command -->
  <g class="l6">
    <text x="26" y="216" class="mono">
      <tspan class="prompt">┌──(root💀zr7-blackbox)-[~/shadow-ops]</tspan>
    </text>
    <text x="26" y="236" class="mono">
      <tspan class="prompt">└─# </tspan><tspan class="cmd">./deploy_recon_daemons.sh --target-scope "*.redacted" --stealth</tspan>
    </text>
  </g>

  <!-- Line 7-8: Execution logs -->
  <g class="l7">
    <text x="40" y="262" class="mono">
      <tspan class="ok">[✓]</tspan><tspan class="val"> GQLHunter-v2.0    : Introspection &amp; WAF Evasion Engine ............. </tspan><tspan class="ok">ARMED</tspan>
    </text>
    <text x="40" y="284" class="mono">
      <tspan class="ok">[✓]</tspan><tspan class="val"> SecretScope       : Deep JS/Git Credential &amp; Entropy Harvester ..... </tspan><tspan class="ok">ARMED</tspan>
    </text>
  </g>
  <g class="l8">
    <text x="40" y="306" class="mono">
      <tspan class="ok">[✓]</tspan><tspan class="val"> Obscura-V8-Agent  : Autonomous Headless SPA &amp; DOM Recon Node ....... </tspan><tspan class="ok">ARMED</tspan>
    </text>
    <text x="40" y="328" class="mono">
      <tspan class="warn">[!]</tspan><tspan class="dim"> TELEMETRY_NOTICE  : Packet inspection active. All footprints zeroed.</tspan>
    </text>
  </g>

  <!-- Line 9: Active prompt with blinking cursor -->
  <g class="l9">
    <text x="26" y="354" class="mono">
      <tspan class="prompt">└─# </tspan><tspan class="cmd">awaiting_next_target </tspan><tspan class="prompt blink">█</tspan>
    </text>
  </g>
</svg>
