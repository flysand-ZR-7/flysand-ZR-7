<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#120409" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff003c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff003c" stroke-width="0.4" stroke-opacity="0.12" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .title { font-size: 42px; font-weight: 900; fill: #f0f6fc; letter-spacing: 6px; }
    .accent { fill: #ff003c; }
    .sub { font-size: 13px; fill: #8b949e; letter-spacing: 3px; }
    .hud { font-size: 11px; fill: #ff003c; letter-spacing: 1.5px; opacity: 0.85; }
    .hex { font-size: 10px; fill: #30363d; letter-spacing: 2px; }
    .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
    .blink { animation: blinkAnim 1.1s infinite step-end; }
    .scanline { animation: scanAnim 6s infinite linear; }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes blinkAnim {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanAnim {
      0% { transform: translateY(-250px); }
      100% { transform: translateY(250px); }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="250" rx="10" fill="url(#bgGrad)" stroke="#21262d" stroke-width="1.5" />
  <rect width="900" height="250" rx="10" fill="url(#grid)" />

  <!-- Corner HUD Brackets -->
  <path d="M 18 45 L 18 18 L 45 18" fill="none" stroke="#ff003c" stroke-width="2" />
  <path d="M 882 45 L 882 18 L 855 18" fill="none" stroke="#ff003c" stroke-width="2" />
  <path d="M 18 205 L 18 232 L 45 232" fill="none" stroke="#ff003c" stroke-width="2" />
  <path d="M 882 205 L 882 232 L 855 232" fill="none" stroke="#ff003c" stroke-width="2" />

  <!-- Background Hex Matrix Watermark -->
  <text x="35" y="42" class="mono hex">0x44 0x65 0x5A 0x73 0x65 0x63 // SHADOW_NODE_ZR7 // 0x7F 0x45 0x4C 0x46</text>
  <text x="615" y="42" class="mono hex">SYS_INTEGRITY: CLOAKED [TOR/V8]</text>

  <!-- Top Telemetry Status -->
  <circle cx="42" cy="66" r="4.5" fill="#ff003c" class="pulse" />
  <text x="55" y="70" class="mono hud">OP_STATUS: ACTIVE_RECON // IDENTITY: [REDACTED]</text>
  <text x="670" y="70" class="mono hud">CLEARANCE: BLACK_TIER_0</text>

  <!-- Main Callsign -->
  <text x="450" y="132" text-anchor="middle" class="mono title" filter="url(#glow)">
    FLYSAND<tspan class="accent">//</tspan>ZR-7
  </text>

  <!-- Subtitle / Alias -->
  <text x="450" y="164" text-anchor="middle" class="mono sub">
    [ <tspan fill="#ff003c" font-weight="bold">DeZsec</tspan> · RED TEAM OPERATOR · OFFENSIVE API &amp; ZERO-DAY RESEARCH ]
  </text>

  <!-- Glowing Divider Line -->
  <rect x="120" y="182" width="660" height="1.5" fill="url(#redGlow)" />

  <!-- Bottom Cryptic Quote -->
  <text x="450" y="208" text-anchor="middle" class="mono" fill="#c9d1d9" font-size="12.5" letter-spacing="1.2">
    "Every system leaves a whisper in the wire. I listen where others trust."<tspan fill="#ff003c" class="blink">_</tspan>
  </text>

  <!-- Subtle Moving Scanline -->
  <rect x="0" y="0" width="900" height="3" fill="#ff003c" opacity="0.14" class="scanline" />
</svg>
